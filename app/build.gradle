apply plugin: 'com.android.application'

android {
    namespace 'com.keysmi.cinema'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.keysmi.cinema"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 221
        versionName "2.2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Release APK is signed in CI with the persistent KeySmi keystore.
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // No androidx / support-library dependencies: MainActivity extends the
    // framework Activity and the theme is a framework theme. Keeps the APK tiny.
}
