name: Build & Release Android TV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build:
    name: Gradle Android TV Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build release APK with Gradle
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Sign APK with the persistent KeySmi key
        run: |
          set -eo pipefail
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)"
          KS="$RUNNER_TEMP/keysmi-release.jks"
          PW="keysmicinema"

          # Signing key priority: repo secret (never committed) -> committed keystore -> generate once.
          if [ -n "${{ secrets.SIGNING_KEYSTORE_B64 }}" ]; then
            echo "Using SIGNING_KEYSTORE_B64 secret (key stays out of the repo)."
            echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > "$KS"
          elif [ -f signing/keysmi-release.jks ]; then
            echo "Using committed signing/keysmi-release.jks."
            cp signing/keysmi-release.jks "$KS"
          else
            echo "No signing key found - generating a permanent one (first run only)."
            mkdir -p signing
            keytool -genkeypair -v -keystore signing/keysmi-release.jks -alias keysmi \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$PW" -keypass "$PW" \
              -dname "CN=KeySmi Cinema, O=KeySmi, C=GB"
            cp signing/keysmi-release.jks "$KS"
            echo "COMMIT_KEYSTORE=1" >> "$GITHUB_ENV"
          fi

          UNSIGNED="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          echo "Gradle output: $UNSIGNED"
          "$BT/zipalign" -f -v -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:"$PW" --key-pass pass:"$PW" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out keysmi-cinema.apk aligned.apk
          "$BT/apksigner" verify --verbose keysmi-cinema.apk
          mkdir -p release_assets
          cp -f keysmi-cinema.apk release_assets/keysmi-cinema.apk
          ls -lh keysmi-cinema.apk

      - name: Commit APK (and keystore if newly generated) to main
        run: |
          git config user.name "Keyurx11"
          git config user.email "keyurx11@gmail.com"
          export GIT_AUTHOR_DATE="2026-08-23T16:45:00 +0100"
          export GIT_COMMITTER_DATE="2026-08-23T16:45:00 +0100"
          git add -f keysmi-cinema.apk release_assets/keysmi-cinema.apk
          if [ "$COMMIT_KEYSTORE" = "1" ] && [ -f signing/keysmi-release.jks ]; then
            git add -f signing/keysmi-release.jks
          fi
          if git diff --staged --quiet; then
            echo "Nothing changed - skipping commit."
            exit 0
          fi
          git commit -m "build: publish keysmi-cinema.apk v2.2.1 with custom 16:9 banner [skip ci]" --date="2026-08-23T16:45:00 +0100"
          git push origin main

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.2.1
          name: KeySmi Cinema v2.2.1
          draft: false
          prerelease: false
          files: release_assets/keysmi-cinema.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
