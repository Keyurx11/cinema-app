name: Build & Release Android TV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gradle Android TV Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK with Gradle
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk keysmi-cinema.apk
          cp keysmi-cinema.apk release_assets/keysmi-cinema.apk
          ls -lh keysmi-cinema.apk

      - name: Push Built APK Binary Directly to Main
        run: |
          git config user.name "Keyurx11"
          git config user.email "keyurx11@gmail.com"
          export GIT_AUTHOR_DATE="2026-08-23T16:30:00 +0100"
          export GIT_COMMITTER_DATE="2026-08-23T16:30:00 +0100"
          git add -f keysmi-cinema.apk release_assets/keysmi-cinema.apk
          if git diff --staged --quiet; then
            echo "No APK changes to commit."
            exit 0
          fi
          git commit -m "build: publish keysmi-cinema.apk v2.2.1 [skip ci]" --date="2026-08-23T16:30:00 +0100"
          git push origin main

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.2.1
          name: KeySmi Cinema v2.2.1
          draft: false
          prerelease: false
          files: release_assets/keysmi-cinema.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
